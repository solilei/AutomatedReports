{% extends "base.html" %}
{% block title %}Delete {{ cadet.name }}{% endblock %}
{% block content %}
<h1>Delete cadet</h1>
<p>Permanently delete {{ cadet.name }} from {{ group.number }} and all {{ score_rows }} of their scores? This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Delete permanently</button>
  <a href="{% url 'roster:cadet_list' group.number %}">Cancel</a>
</form>
{% endblock %}
