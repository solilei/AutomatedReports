{% extends "base.html" %}
{% block title %}Account created{% endblock %}
{% block content %}
<h1>Account created</h1>
<p>Temporary password for {{ account.username }}: {{ password }}</p>
<p>This password is shown once. Give it to the user; they must change it at first sign-in.</p>
<p><a href="{% url 'accounts:user_list' %}">Back to accounts</a></p>
{% endblock %}
