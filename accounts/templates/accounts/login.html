{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if show_local_form %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
</form>
{% endif %}
{% if show_microsoft %}
<p><a href="/accounts/microsoft/login/">Sign in with Microsoft</a></p>
{% endif %}
{% endblock %}
