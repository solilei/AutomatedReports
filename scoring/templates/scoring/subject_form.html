{% extends "base.html" %}
{% block title %}{% if subject %}Rename subject{% else %}Add subject{% endif %}{% endblock %}
{% block content %}
<h1>{% if subject %}Rename subject{% else %}Add subject{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
</form>
<p><a href="{% url 'scoring:programme_detail' programme.pk %}">Back to {{ programme.name }}</a></p>
{% endblock %}
